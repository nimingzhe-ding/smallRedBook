server:
  port: 8081

spring:
  main:
    allow-circular-references: true
  application:
    name: hmdp
  servlet:
    multipart:
      max-file-size: ${HMDP_UPLOAD_MAX_VIDEO_SIZE:524288000}
      max-request-size: ${HMDP_UPLOAD_MAX_VIDEO_SIZE:524288000}
  ai:
    dashscope:
      enabled: ${HMDP_AI_ENABLED:false}
      api-key: "${DASHSCOPE_API_KEY:}"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${HMDP_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${HMDP_DATASOURCE_USERNAME:root}"
    password: "${HMDP_DATASOURCE_PASSWORD:120402}"
  data:
    redis:
      host: "${HMDP_REDIS_HOST:192.168.19.130}"
      port: ${HMDP_REDIS_PORT:6379}
      password: "${HMDP_REDIS_PASSWORD:120402}"
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: "${HMDP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        linger.ms: 5
        compression.type: lz4
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

mybatis-plus:
  type-aliases-package: com.hmdp.entity

logging:
  level:
    com.hmdp: debug

hmdp:
  storage:
    type: "${HMDP_STORAGE_TYPE:local}"
    oss:
      endpoint: "${HMDP_OSS_ENDPOINT:}"
      bucket: "${HMDP_OSS_BUCKET:}"
      access-key: "${HMDP_OSS_ACCESS_KEY:}"
      secret-key: "${HMDP_OSS_SECRET_KEY:}"
      domain: "${HMDP_OSS_DOMAIN:}"
  upload:
    image-dir: "${HMDP_IMAGE_UPLOAD_DIR:D:/hmdp/nginx-1.18.0/html/hmdp/imgs}"
    max-image-size: ${HMDP_UPLOAD_MAX_IMAGE_SIZE:5242880}
    max-video-size: ${HMDP_UPLOAD_MAX_VIDEO_SIZE:524288000}
    direct-upload-expire-minutes: ${HMDP_DIRECT_UPLOAD_EXPIRE_MINUTES:10}
  ai:
    model: qwen-plus
    customer-service-temperature: 0.6
    query-temperature: 0.2
    max-tokens: 1500
    max-messages: 12
    knowledge-top-k: 3
  auth:
    debug-code-response: ${HMDP_AUTH_DEBUG_CODE_RESPONSE:true}
  moderation:
    enabled: ${HMDP_MODERATION_ENABLED:true}
    sensitive-words: "${HMDP_SENSITIVE_WORDS:}"
  search:
    elasticsearch:
      enabled: ${HMDP_ELASTICSEARCH_ENABLED:true}
      uris: "${HMDP_ELASTICSEARCH_URIS:http://localhost:9200}"
      index: "${HMDP_ELASTICSEARCH_INDEX:hmdp_search}"
  canal:
    enabled: ${HMDP_CANAL_ENABLED:false}
    host: "${HMDP_CANAL_HOST:127.0.0.1}"
    port: ${HMDP_CANAL_PORT:11111}
    destination: "${HMDP_CANAL_DESTINATION:example}"
    username: "${HMDP_CANAL_USERNAME:}"
    password: "${HMDP_CANAL_PASSWORD:}"
    subscribe: "${HMDP_CANAL_SUBSCRIBE:.*\\.tb_blog,.*\\.tb_user,.*\\.tb_video_danmaku}"
    batch-size: ${HMDP_CANAL_BATCH_SIZE:1000}
    idle-sleep-millis: ${HMDP_CANAL_IDLE_SLEEP_MILLIS:500}
    initial-backoff-millis: ${HMDP_CANAL_INITIAL_BACKOFF_MILLIS:1000}
    max-backoff-millis: ${HMDP_CANAL_MAX_BACKOFF_MILLIS:30000}
    cache-ttl-minutes: ${HMDP_CANAL_CACHE_TTL_MINUTES:30}
  seckill:
    kafka:
      order-topic: "${HMDP_SECKILL_ORDER_TOPIC:seckill-order}"
      order-dlt-topic: "${HMDP_SECKILL_ORDER_DLT_TOPIC:seckill-order.DLT}"
      order-consumer-group: "${HMDP_SECKILL_ORDER_CONSUMER_GROUP:seckill-order-consumer-group}"
      partitions: ${HMDP_SECKILL_ORDER_PARTITIONS:3}
      replicas: ${HMDP_SECKILL_ORDER_REPLICAS:1}
      listener-concurrency: ${HMDP_SECKILL_ORDER_CONCURRENCY:3}
  danmaku:
    websocket:
      enabled: ${HMDP_DANMAKU_WS_ENABLED:true}
      port: ${HMDP_DANMAKU_WS_PORT:8090}
      path: "${HMDP_DANMAKU_WS_PATH:/ws/danmaku}"
      reader-idle-seconds: ${HMDP_DANMAKU_WS_READER_IDLE_SECONDS:75}
      max-frame-payload-length: ${HMDP_DANMAKU_WS_MAX_FRAME_PAYLOAD_LENGTH:1024}
    kafka:
      topic: "${HMDP_DANMAKU_TOPIC:video-danmaku}"
      dlt-topic: "${HMDP_DANMAKU_DLT_TOPIC:video-danmaku.DLT}"
      consumer-group: "${HMDP_DANMAKU_CONSUMER_GROUP:video-danmaku-consumer-group}"
      partitions: ${HMDP_DANMAKU_PARTITIONS:3}
      replicas: ${HMDP_DANMAKU_REPLICAS:1}
      listener-concurrency: ${HMDP_DANMAKU_CONCURRENCY:2}
      cache-limit: ${HMDP_DANMAKU_CACHE_LIMIT:300}
      cache-ttl-hours: ${HMDP_DANMAKU_CACHE_TTL_HOURS:48}
  private-message:
    websocket:
      enabled: ${HMDP_PRIVATE_MESSAGE_WS_ENABLED:true}
      port: ${HMDP_PRIVATE_MESSAGE_WS_PORT:8091}
      path: "${HMDP_PRIVATE_MESSAGE_WS_PATH:/ws/messages}"
      reader-idle-seconds: ${HMDP_PRIVATE_MESSAGE_WS_READER_IDLE_SECONDS:75}
      max-frame-payload-length: ${HMDP_PRIVATE_MESSAGE_WS_MAX_FRAME_PAYLOAD_LENGTH:2048}
