services:
  app:
    build: .
    ports:
      - "8081:8081"
      - "8090:8090"
      - "8091:8091"
    environment:
      HMDP_DATASOURCE_URL: "jdbc:mysql://mysql:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      HMDP_DATASOURCE_USERNAME: "root"
      HMDP_DATASOURCE_PASSWORD: "root123"
      HMDP_REDIS_HOST: "redis"
      HMDP_REDIS_PORT: "6379"
      HMDP_REDIS_PASSWORD: ""
      HMDP_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      HMDP_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
      HMDP_CANAL_ENABLED: "true"
      HMDP_CANAL_HOST: "canal"
      HMDP_CANAL_PORT: "11111"
      HMDP_CANAL_DESTINATION: "example"
      HMDP_DANMAKU_WS_PORT: "8090"
      HMDP_PRIVATE_MESSAGE_WS_PORT: "8091"
      HMDP_STORAGE_TYPE: "local"
      HMDP_IMAGE_UPLOAD_DIR: "/data/imgs"
    volumes:
      - upload-data:/data/imgs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      canal:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command:
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
    environment:
      MYSQL_ROOT_PASSWORD: "root123"
      MYSQL_DATABASE: "hmdp"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:29092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    ports:
      - "9200:9200"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  canal:
    image: canal/canal-server:v1.1.7
    ports:
      - "11111:11111"
    environment:
      canal.auto.scan: "false"
      canal.destinations: "example"
      canal.instance.master.address: "mysql:3306"
      canal.instance.dbUsername: "canal"
      canal.instance.dbPassword: "canal"
      canal.instance.connectionCharset: "UTF-8"
      canal.instance.tsdb.enable: "true"
      canal.instance.gtidon: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  upload-data:
