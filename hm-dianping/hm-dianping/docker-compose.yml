name: xiaohongshu

services:
  app:
    build: .
    ports:
      - "8081:8081"
      - "8090:8090"
      - "8091:8091"
    environment:
      XHS_DATASOURCE_URL: "${XHS_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/xiaohongshu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
      XHS_DATASOURCE_USERNAME: "${XHS_DATASOURCE_USERNAME:-root}"
      XHS_DATASOURCE_PASSWORD: "${XHS_DATASOURCE_PASSWORD:-120402}"
      XHS_REDIS_HOST: "${XHS_REDIS_HOST:-192.168.19.130}"
      XHS_REDIS_PORT: "${XHS_REDIS_PORT:-6379}"
      XHS_REDIS_PASSWORD: "${XHS_REDIS_PASSWORD:-120402}"
      XHS_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      XHS_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
      XHS_CANAL_ENABLED: "true"
      XHS_CANAL_HOST: "canal"
      XHS_CANAL_PORT: "11111"
      XHS_CANAL_DESTINATION: "example"
      XHS_DANMAKU_WS_PORT: "8090"
      XHS_PRIVATE_MESSAGE_WS_PORT: "8091"
      XHS_STORAGE_TYPE: "${XHS_STORAGE_TYPE:-local}"
      XHS_OSS_ENDPOINT: "${XHS_OSS_ENDPOINT:-}"
      XHS_OSS_BUCKET: "${XHS_OSS_BUCKET:-}"
      XHS_OSS_ACCESS_KEY: "${XHS_OSS_ACCESS_KEY:-}"
      XHS_OSS_SECRET_KEY: "${XHS_OSS_SECRET_KEY:-}"
      XHS_OSS_DOMAIN: "${XHS_OSS_DOMAIN:-}"
      XHS_UPLOAD_MAX_VIDEO_SIZE: "${XHS_UPLOAD_MAX_VIDEO_SIZE:-524288000}"
      XHS_DIRECT_UPLOAD_EXPIRE_MINUTES: "${XHS_DIRECT_UPLOAD_EXPIRE_MINUTES:-10}"
      XHS_IMAGE_UPLOAD_DIR: "/data/imgs"
      XHS_AI_ENABLED: "${XHS_AI_ENABLED:-false}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    volumes:
      - upload-data:/data/imgs
    depends_on:
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      canal:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    profiles: ["docker-db"]
    command:
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
    environment:
      MYSQL_ROOT_PASSWORD: "root123"
      MYSQL_DATABASE: "xiaohongshu"
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["docker-db"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    user: "0:0"
    ports:
      - "9092:29092"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka-apache-data:/tmp/kraft-combined-logs
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    ports:
      - "9200:9200"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  canal:
    image: canal/canal-server:v1.1.7
    ports:
      - "11111:11111"
    environment:
      canal.auto.scan: "false"
      canal.destinations: "example"
      canal.instance.master.address: "${XHS_CANAL_MYSQL_ADDRESS:-host.docker.internal:3306}"
      canal.instance.dbUsername: "${XHS_CANAL_MYSQL_USERNAME:-canal}"
      canal.instance.dbPassword: "${XHS_CANAL_MYSQL_PASSWORD:-canal}"
      canal.instance.connectionCharset: "UTF-8"
      canal.instance.tsdb.enable: "true"
      canal.instance.gtidon: "false"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  kafka-apache-data:
  elasticsearch-data:
  upload-data:
